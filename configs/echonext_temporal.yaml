experiment: echonext_in_domain_temporal_validation
seed: 42
device: cuda

source_manifest: data/echonext_manifests/external_test.csv
manifest_root: data/echonext_temporal
output_root: outputs/echonext_temporal

train_years: [2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020]
val_years: [2021]
test_years: [2022]

batch_size: 32
num_workers: 0
target_length: 2000
normalize: true

epochs: 50
learning_rate: 0.0002
weight_decay: 0.0
optimizer: Adam
scheduler: ReduceLROnPlateau
scheduler_factor: 0.5
scheduler_patience: 2
early_stopping_patience: 5
gradient_clip: 5.0
use_amp: true

focal_alpha: auto
focal_gamma: 2.0
focal_eps: 1.0e-8

lstm_hidden: 128
attention_heads: 4
dropout: 0.5
num_classes: 2

threshold: 0.5
load_mimic_weights: false
use_dfcl: false
